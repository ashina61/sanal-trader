name: Cloudflare Scheduler Unit Tests

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/**"
      - ".github/workflows/scheduler-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scheduler-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test cloudflare/test/worker.test.mjs
