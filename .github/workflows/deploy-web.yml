name: Publish SanalTrader Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: sanaltrader-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify release history
        run: bash scripts/verify_changelog.sh

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate web files
        run: flutter create --platforms=web --org com.ashina61 --project-name sanal_trader .

      - name: Fetch dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Build for GitHub Pages
        run: |
          flutter build web --release --base-href /sanal-trader/
          python3 scripts/version_web_bootstrap.py build/web
          touch build/web/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Verify Pages artifact is accessible before deployment
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            for (let attempt = 1; attempt <= 12; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                owner, repo, run_id: context.runId, per_page: 100,
              });
              const ready = data.artifacts.some(a => a.name === 'github-pages' && !a.expired);
              if (ready) {
                core.info('Pages artifact is available via the Actions API.');
                await new Promise(resolve => setTimeout(resolve, 5000));
                return;
              }
              core.warning('Pages artifact not visible yet (attempt ' + attempt + '/12)');
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            core.setFailed('Pages artifact was uploaded but not visible via Actions API.');

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
