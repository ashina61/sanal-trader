name: SanalTrader Web Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify release history
        run: bash scripts/verify_changelog.sh

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create web platform scaffolding
        run: flutter create --platforms=web --org com.ashina61 --project-name sanal_trader .

      - name: Fetch dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build web preview
        run: |
          flutter build web --release
          python3 scripts/version_web_bootstrap.py build/web
