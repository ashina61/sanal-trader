name: Safe Smart-Money Tests

on:
  pull_request:
    paths:
      - "backend/**"
      - "lib/**"
      - ".github/workflows/smart-money-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-and-flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Run Python engine tests without any feed secrets
        run: python3 -m unittest discover -s backend/tests -v
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
